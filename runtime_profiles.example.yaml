runtime_profiles:
  local_ollama_cuda0:
    backend: ollama
    api_base_env: OLLAMA_BASE_URL
    default_api_base: http://127.0.0.1:11434
    gpu: cuda0

  # local_llamacpp_cuda0 is illustrative; paths below are for documentation only.
  local_llamacpp_cuda0:
    backend: llama_cpp
    server_bin_env: ${LLAMA_SERVER_BIN}
    model_root_env: ${MODEL_ROOT_GGUF}
    default_port: 8080
    default_gpu_layers: 99
    default_ctx: 131072
    gpu: cuda0

  cloud_minimax:
    backend: openai_compatible
    api_base_env: MINIMAX_API_BASE
    api_key_env: MINIMAX_API_KEY
    # The adapters append /v1 themselves, so the base stops at the host.
    default_api_base: https://api.minimax.io
    provider: minimax

  cloud_openrouter:
    backend: openai_compatible
    api_base_env: OPENROUTER_API_BASE
    api_key_env: OPENROUTER_API_KEY
    default_api_base: https://openrouter.ai/api
    provider: openrouter

  # DIRECT at DeepSeek — used by DPMtF's shipped experimental 9010 flows.
  # The base is DeepSeek's own Anthropic-compatible surface (the documented
  # way to drive Claude Code against DeepSeek); the claude-code adapter
  # turns it into ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN=$DEEPSEEK_API_KEY.
  cloud_deepseek_direct:
    backend: openai_compatible
    api_base_env: DEEPSEEK_API_BASE
    api_key_env: DEEPSEEK_API_KEY
    default_api_base: https://api.deepseek.com/anthropic
    provider: deepseek

  # ONYX enterprise-knowledge runtime (optional; invoke-only).
  # Capabilities are declared as DATA — no adapter code changes needed
  # for providers that only support a subset of operations.
  local_onyx:
    backend: onyx
    api_base_env: ONYX_API_BASE
    default_api_base: http://127.0.0.1:9162
    api_key_env: ONYX_API_KEY          # Business tier only
    email_env: ONYX_EMAIL              # basic-auth fallback (default)
    password_env: ONYX_ADMIN_PASSWORD
    provider: onyx
    capabilities: [invoke]

  # Remote AI-PC model endpoint (SCOPE addendum 2026-09-05): an OpenAI-
  # compatible model served on ANOTHER AI-PC, reached over LAN/Tailscale.
  # One alias -> one fixed endpoint -> one remote machine; no automatic
  # routing. Validation uses the openai_compatible adapter's
  # is_api_reachable + is_model_available; an unreachable endpoint is a
  # normal explicit failure, never a reroute. Set REMOTE_AI_PC_API_KEY
  # only if the remote requires one (never commit the value).
  remote_ai_pc:
    backend: openai_compatible
    api_base_env: REMOTE_AI_PC_API_BASE
    default_api_base: http://remote-ai-pc:8090/v1
    api_key_env: REMOTE_AI_PC_API_KEY
    provider: remote_ai_pc

  # Two independent queued remote inference nodes (SCOPE addendum 2026-09-05).
  # Each is a dedicated AI-PC running FreeToken (or another OpenAI-compatible
  # runtime) with ONE warm model, serialized single-worker via the runtime's
  # own --max-running-requests 1 (that IS the node's FIFO queue; the allocator
  # only routes). Reached over LAN/Tailscale; the optional API token lives in
  # the env var, never committed. Nodes operate independently — no load
  # balancing, no failover, no dynamic selection (out of scope).
  ai_pc_1:
    backend: openai_compatible
    api_base_env: AI_PC_1_API_BASE
    default_api_base: http://ai-pc-1:8090/v1
    api_key_env: AI_PC_1_API_TOKEN
    provider: remote_inference_node
  ai_pc_2:
    backend: openai_compatible
    api_base_env: AI_PC_2_API_BASE
    default_api_base: http://ai-pc-2:8090/v1
    api_key_env: AI_PC_2_API_TOKEN
    provider: remote_inference_node
