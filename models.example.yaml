models:
  imple-fast:
    runtime_profile: local_ollama_cuda0
    real_model: qwen36-27b-q4km:latest
    context: 131072
    lifecycle_policy: persistent
    clients:
      opencode: true
      claude-code: true

  imple01-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder:30b-256k
    context: 131072
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
      claude-code: false

  imple01-claude:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder:30b-256k
    context: 131072
    lifecycle_policy: stop_after_step
    clients:
      opencode: false
      claude-code: true

  review-cloud:
    runtime_profile: cloud_minimax
    real_model: minimax-m3
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
      claude-code: false

  # The alias DPMtF-WebUI's shipped example flows resolve (migration 091:
  # example-cloud, example-01-PLOOP, example-02-ELOOP — every role runs
  # cloud_minimax over OpenCode, so MINIMAX_API_KEY is the only credential
  # a fresh install needs). Values mirror the production alias: output is
  # capped at 64k because OpenCode never needs more in a single reply and
  # the cap keeps a runaway turn from billing a full 128k completion.
  # claude-code is deliberately absent: the claude_code adapter rejects
  # provider=minimax (no Anthropic-shaped support at the time of writing).
  cloud_minimax:
    runtime_profile: cloud_minimax
    real_model: MiniMax-M3
    context: 1000000
    max_output_tokens: 65536
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
      claude-code: false

  openrouter-test:
    runtime_profile: cloud_openrouter
    real_model: qwen3-30b-a3b
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
      claude-code: true

  # Example only: local llama.cpp paths are illustrative and must be overridden via env.
  llama-test:
    runtime_profile: local_llamacpp_cuda0
    # In production use ${MODEL_ROOT_GGUF}/test.gguf; the path below is illustrative.
    model_path: ${MODEL_ROOT_GGUF}/test.gguf
    context: 262144
    parallel: 1
    n_cpu_moe: 26
    threads: 12
    batch: 160
    ubatch_size: 128
    cache_type_k: turbo4
    cache_type_v: turbo3
    flash_attn: "on"
    reasoning: "off"
    no_mmap: true
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
      claude-code: false

  # ONYX assistant alias (optional runtime; spec example 'company_knowledge')
  company-knowledge:
    runtime_profile: local_onyx
    real_model: allocator-plain   # persona display name (informational)
    persona_id: 1                 # ONYX persona/assistant id
    invoke_timeout: 120
    lifecycle_policy: cloud_noop
    clients:
      headless: true

  # ─────────────────────────────────────────────────────────────
  # V6 example — shared foundation runtime.
  # Two aliases share one runtime_instance; the instance owns physical
  # identity (port, model_path, context, placement, server_bin) so the
  # aliases cannot also set those fields. Port is 8090, NOT 8080:
  # 8080 is the machine's deliberate one-at-a-time port (qwen35/glm-air
  # sweep it weekdays 14:00Z via the trade-engine reclaim) and a shared
  # instance needs its own dedicated port to coexist.
  # ─────────────────────────────────────────────────────────────
  shared-architect:
    runtime_instance: shared-llm-118b
    inference_profile: profile-careful
    clients:
      opencode: true
      claude-code: false

  shared-reviewer:
    runtime_instance: shared-llm-118b
    inference_profile: profile-fast
    clients:
      opencode: true
      claude-code: false


runtime_instances:
  # One physical llama-server process; the two aliases above resolve to it.
  shared-llm-118b:
    runtime_profile: local_llamacpp_cuda0
    model_path: ${MODEL_ROOT_GGUF}/Laguna-S-2.1-118B-A8B-IQ4_XS.gguf
    server_bin_path: ${LLAMA_SERVER_BIN}
    port: 8090                     # NOT 8080 — see comment above the aliases.
    context: 262144
    n_cpu_moe: 31
    gpu_layers: 99
    cache_type_k: q4_0
    cache_type_v: q4_0
    lifecycle_policy: shared_runtime


# Per-alias inference tuning referenced by aliases via ``inference_profile``.
# Only the IMPLEMENTED fields are accepted; ``temperature`` and ``top_p``
# are part of the four candidate fields but have no transport path in V6
# and are LOUDLY rejected by the doctor and the resolver (see DEFERRED
# FIELDS below). These do not transport system prompts or governance —
# they tune how inference is executed for the alias that references them.
inference_profiles:
  profile-careful:
    reasoning_budget: 4096
    max_output_tokens: 16384

  profile-fast:
    reasoning_budget: 1024
    max_output_tokens: 8192

# DEFERRED FIELDS (cannot be set in V6):
#   - temperature: no existing transport path; declaring it would
#     silently do nothing, which the Mission Contract forbids.
#   - top_p:       same as above.
# The doctor reports an error of the form::
#     "inference_profile 'profile-X' field 'temperature' is not
#      implemented in V6 (deferred) — remove it"
# and ``resolve_alias`` raises ``ResolutionError`` with the same message,
# so a programmatic caller skipping the doctor still fails loudly.
