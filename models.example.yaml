  # Example only: local llama.cpp paths are illustrative and must be overridden via env.
  llama-test:
    runtime_profile: local_llamacpp_cuda0
    # In production use ${MODEL_ROOT_GGUF}/test.gguf; the path below is illustrative.
    model_path: /home/svend/ai-data/models/gguf/test.gguf
    context: 262144
    parallel: 1
    n_cpu_moe: 26
    threads: 12
    batch: 160
    ubatch_size: 128
    cache_type_k: turbo4
    cache_type_v: turbo3
    flash_attn: on
    reasoning: off
    no_mmap: true
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
      claude-code: false
