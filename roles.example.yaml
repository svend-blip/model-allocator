roles:
  imple01:
    default_alias: imple01-local
    config_dir: imple01
    client_aliases:
      opencode: imple01-local
      claude-code: imple01-claude

  claude-test:
    default_alias: imple01-claude
    config_dir: claude-test
    client_aliases:
      claude-code: imple01-claude

  openrouter-test:
    default_alias: openrouter-test
    config_dir: openrouter-test
    client_aliases:
      opencode: openrouter-test

  # Knowledge-advisor role backed by an ONYX assistant via the headless
  # runner. BridgeV002 config for such a role: default_runtime -> the
  # command from `run --role advisor01 --client headless` (zero bridge
  # code changes).
  advisor01:
    default_alias: company-knowledge
    client_aliases:
      headless: company-knowledge

  # ── DPMtF-WebUI shipped example flows (migration 091) ─────────────────
  # Role keys match bridge_roles.role_key EXACTLY (the allocator role-key
  # contract). All eight resolve cloud_minimax over OpenCode so a fresh
  # cross-repo install needs a single MINIMAX_API_KEY. example-cloud is
  # the 1-flow example; the example-* roles below it serve the
  # PLOOP/ELOOP 2-flow example pair.
  ex-super-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  ex-imple-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  ex-review-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-planning-supervisor:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-execution-decomposer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-implementer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-reviewer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-escalation-supervisor:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  # ── DPMtF 9010 flows (migration 093) — PLOOP planning supervisor ─────
  # DeepSeek V4 Pro DIRECT at DeepSeek over claude-code. The 9010 ELOOP
  # roles run codex as a native harness (harness_provider) and therefore
  # need no entry here.
  9010-planning-supervisor:
    default_alias: cloud_deepseek
    client_aliases:
      claude-code: cloud_deepseek
