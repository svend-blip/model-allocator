    config_dir: fable5-role
    client_aliases:
      claude-code: fable5

  # Both supervisor roles share the tmux session and config_dir "supervisor"
  # and differ only in governance file (500 = Human-paired, 501 = autonomous).
  # The keys must match bridge_roles.role_key exactly or the role falls back to
  # the direct path and the allocator binding is silently ignored.
  supervisor:
    default_alias: sonnet5
    config_dir: supervisor
    client_aliases:
      claude-code: sonnet5

  supervisor_auto:
    default_alias: sonnet5
    config_dir: supervisor_auto
    client_aliases:
      claude-code: sonnet5

  # ── RevEngineer (491/492/493) ──────────────────────────────
  # Retro-game reverse-engineering flow. Keys MUST match bridge_roles.role_key
  # exactly (see supervisor note above) or the allocator binding is ignored.
  # The one local model in this flow, and the reason 491's "everything here is
  # hosted" section had to be rewritten: dispatch really does stop and start
  # this server, so ConnectionRefused after a handoff is the normal state for
  # this role rather than an outage. OpenCode, not Claude Code -- llama.cpp
  # reaches the client through @ai-sdk/openai-compatible.
  Rev_Supervisor:
    default_alias: glm-air-derestricted-local
    config_dir: Rev_Supervisor
    client_aliases:
      opencode: glm-air-derestricted-local

  # Moved off MiniMax-M3 on 2026-08-12. MiniMax returned its own pseudo-XML
  # tool syntax as plain text instead of structured tool_calls, ending the
  # turn with finish "stop" and no tool executed: 1 of 18 completed turns on
  # 11-12 Aug, then 5 of 7 on the 12th. At that rate the role cannot work at
  # all, and nothing about it is fixable from this side.
  #
  # Sharing Rev_Supervisor's alias is deliberate beyond the model choice:
  # dispatch only stops the outgoing model when from_alias != to_alias, so a
  # supervisor->imple handoff now keeps the server loaded instead of tearing
  # it down and rebuilding it. The two roles never run concurrently, which is
  # what makes one llama.cpp slot enough.
  Rev_Imple:
    default_alias: qwen35-uncensored-local
    config_dir: Rev_Imple
    client_aliases:
      opencode: qwen35-uncensored-local

  Rev_Review:
    default_alias: sonnet5
    config_dir: Rev_Review
    client_aliases:
      claude-code: sonnet5

  # ── supervised_review (452/453/454) ────────────────────────
  # Distinct from strict_review's imple01/review01/review02 so the two
  # flows can run concurrently and be tuned independently. Aliases start
  # identical to the roles they were split from — this split changed WHO
  # is dispatched, not WHAT model runs.
  imple01sup:
    default_alias: cloud_minimax
    config_dir: imple01sup
    client_aliases:
      opencode: cloud_minimax

  review01sup:
    default_alias: review01-local
    config_dir: review01sup
    client_aliases:
      opencode: review01-local

  review02sup:
    default_alias: review02-local
    config_dir: review02sup
    client_aliases:
      opencode: review02-local

  supervisor01_llama:
    default_alias: laguna-local
    config_dir: supervisor01_llama
    client_aliases:
      claude-code: laguna-local

  # All three llama_SG roles share one local model on one client. That is
  # the point: two models on a single 32 GB GPU forced a swap on every
  # handoff, and the swap machinery — leases, VRAM waits, orphaned servers
  # — caused most of this flow's failures on 2026-08-05. One model, no swap.
  # The implementer's work is mechanical — read a handoff, edit a file, run
  # the checks — so it is bought speed, not context. Laguna took 19-21
  # minutes per turn at ~11 tokens/second; a 27B at q4_K_M fully on GPU
  # should be several times that. The client stays claude-code so the role
  # keeps the permission-bypass and avoids OpenCode's dialogs.
  imple01SG:
    default_alias: imple-fast
    config_dir: imple01SG
    client_aliases:
      claude-code: imple-fast

  # The reviewer judges rather than edits, and it runs most often in the
  # chain. Laguna took 12-27 minutes per verdict and wedged entirely once
  # under memory pressure. The 35b-a3b MoE is the model five other reviewer
  # roles already use, and its 3B active parameters keep it fast despite the
  # size.
  review01SG:
    default_alias: review02-local
    config_dir: review01SG
    client_aliases:
      claude-code: review02-local

  # ── preferred_cloud ──────────────────────────────────────────────────
  # The same chain shape as llama_SG on hosted models. Keys must match
  # bridge_roles.role_key exactly — the allocator looks a role up by that
  # string, and a mismatch resolves to nothing rather than to a default.
  #
  # Nothing here is loaded or unloaded: all three aliases are cloud_noop, so
  # start and stop are credential checks. There is no card to take turns on,
  # which is why this flow has no model-lifecycle dispatch scripts.
  Pre-super-cl:
    default_alias: opus5
    config_dir: Pre-super-cl
    client_aliases:
      claude-code: opus5

  # OpenCode, not Claude Code. The claude_code adapter rejects
  # provider=minimax outright; MiniMax exposes an Anthropic-shaped endpoint
  # but it is not wired, so the OpenAI-compatible path is the supported one.
  Pre-imple-cl:
    default_alias: cloud_minimax
    config_dir: Pre-imple-cl
    client_aliases:
      opencode: cloud_minimax

  Pre-review-cl:
    default_alias: sonnet5
    config_dir: Pre-review-cl
    client_aliases:
      claude-code: sonnet5

  # ── preferred_cloud_harness (511/512/513) ──────────────────────────
  # Same chain shape as preferred_cloud with an explicit coding harness per
  # role. Only the reviewer goes through the model allocator — the supervisor
  # runs DeepSeek Harness and the implementer runs Codex CLI, both launched
  # directly by DPMtF's harness module. Reuses the existing sonnet5 alias;
  # no second Sonnet 5 runtime configuration.
  review-claude-sonnet5:
    default_alias: sonnet5
    config_dir: review-claude-sonnet5
    client_aliases:
      claude-code: sonnet5
  # ── 1000-01-PLOOP / 1000-02-ELOOP (two-flow setup, spec §13) ────────
  # Appearing here means "the allocator can resolve a model for this role",
  # NOT "the allocator launches its interface". The distinction is the
  # Launch Authority boundary: model-allocator owns models and runtimes,
  # harness-allocator owns interface launches.
  #
  # The planning supervisor (claude-code) and reviewer (opencode) are both
  # resolved AND launched here, because the allocator has client adapters
  # for those two. The execution decomposer and implementer run the qwen
  # harness: harness-allocator builds their launch argv, and this file
  # exists for them only so `resolve --client qwen` can answer with the
  # FreeToken alias and its endpoint. They were absent until 2026-08-27,
  # which made them unlaunchable — "Start code interface" resolved them
  # through the allocator and got "Role not found", and there was no other
  # path to a model binding. Absence was never the same thing as
  # delegation.
  1000-planning-supervisor:
    default_alias: opus5
    config_dir: 1000-planning-supervisor
    client_aliases:
      claude-code: opus5

  # Moved off Qwen38-Standard 2026-08-27: its llama.cpp build faulted the GPU
  # three times (NVRM Xid 8, all llama-server, none FreeToken, card healthy),
  # leaving the Reviewer unable to run and its verdict undeliverable. All
  # three ELOOP roles now share one resident model, which is what the alias's
  # stop_after_step lifecycle already assumes.
  1000-reviewer:
    default_alias: freetoken-qwen36-35b-a3b
    config_dir: 1000-reviewer
    client_aliases:
      opencode: freetoken-qwen36-35b-a3b

  # ELOOP's two execution roles. They ran the qwen harness until 2026-08-27,
  # when run 002 proved that combination unusable: this alias advertises
  # 262144 tokens and holds 49152, and Qwen Code has no knob for a context
  # limit — its table of model windows contains only glm-* entries, so every
  # other model gets a ~1M default. It filled the real budget while reporting
  # 4.9% of an imagined one, the server clamped its reply to 31 tokens, and
  # the stream died before a single handoff was written.
  #
  # OpenCode can be told the truth, so they run OpenCode against the same
  # alias. The allocator writes `limit.context` from the SMALLER of `context`
  # and `num_tokens` (see adapters/opencode._client_context) — without that
  # this move would have relocated the failure rather than removed it.
  1000-execution-decomposer:
    default_alias: freetoken-qwen36-35b-a3b
    config_dir: 1000-execution-decomposer
    client_aliases:
      opencode: freetoken-qwen36-35b-a3b

  1000-implementer:
    # Switched to cloud_minimax 2026-08-31 (run 011 escalation boundary:
    # four consecutive evidence-discipline failures on the local MoE;
    # Human-delegated model authority, see runs/011/RUN-LEDGER.md).
    default_alias: cloud_minimax
    config_dir: 1000-implementer
    client_aliases:
      opencode: cloud_minimax

  # 1010 flows — the all-cloud twin of the 1000 setup (Human decision
  # 2026-08-28), targeting /home/svend/simple-harness. Keys must equal
  # bridge_roles.role_key exactly. The escalation supervisor runs
  # harness_provider (dsh) and is deliberately absent here, as in 1000.
  1010-planning-supervisor:
    default_alias: opus5
    config_dir: 1010-planning-supervisor
    client_aliases:
      claude-code: opus5

  1010-execution-decomposer:
    default_alias: cloud_minimax
    config_dir: 1010-execution-decomposer
    client_aliases:
      opencode: cloud_minimax

  1010-implementer:
    default_alias: cloud_minimax
    config_dir: 1010-implementer
    client_aliases:
      opencode: cloud_minimax

  1010-reviewer:
    default_alias: sonnet5
    config_dir: 1010-reviewer
    client_aliases:
      claude-code: sonnet5

  # 9000 test flows (Human decision 2026-08-30) — the flows that PROVE the
  # model-allocator + harness-allocator composition. Keys must equal
  # bridge_roles.role_key exactly. The three chain roles run the
  # simple-harness interface (native launch); this file answers only the
  # MODEL half of their identity. The escalation supervisor runs
  # harness_provider (dsh) and is deliberately absent here.
  9000-planning-supervisor:
    # Human decision 2026-09-02: Qwen3.8-Max via the Token Plan's Anthropic
    # endpoint, harness stays claude-code. Previous: opus5.
    default_alias: cloud_qwen38max-claude
    config_dir: 9000-planning-supervisor
    client_aliases:
      claude-code: cloud_qwen38max-claude

  9000-execution-decomposer:
    default_alias: cloud_minimax
    client_aliases:
      simple-harness: cloud_minimax

  9000-implementer:
    # Human decision 2026-09-02 (Run 018 closure): implementer moves to
    # Qwen3.8-Max via the Token Plan after five MiniMax shell-loop overflows
    # in one day; decomposer and reviewer stay on cloud_minimax for comparison.
    default_alias: cloud_qwen38max
    client_aliases:
      simple-harness: cloud_qwen38max

  9000-reviewer:
    default_alias: cloud_minimax
    client_aliases:
      simple-harness: cloud_minimax

  # lightworker flow. The key must equal bridge_roles.role_key exactly:
  # `model-allocator run` resolves --role against this file and has no
  # --alias form, so a rename on either side breaks the other.
  review01LW:
    default_alias: sonnet5
    config_dir: review01LW
    client_aliases:
      claude-code: sonnet5

  # ── pi_test (Pi frontend A/B) ──────────────────────────────
  # Same models as the roles they are compared against; only the frontend
  # differs. That is the whole design: model, runtime and governance held
  # constant so the comparison measures the client and nothing else.
  pi_imple01:
    default_alias: cloud_minimax
    config_dir: pi_imple01
    client_aliases:
      pi: cloud_minimax

  pi_imple01_glm:
    default_alias: glm-air-derestricted-local
    config_dir: pi_imple01_glm
    client_aliases:
      pi: glm-air-derestricted-local

  # The OpenCode arm of pi_test. Identical to pi_imple01 except for the
  # client — that is the point, and any drift between these two entries
  # invalidates the comparison they exist to support.
  oc_imple01:
    default_alias: cloud_minimax
    config_dir: oc_imple01
    client_aliases:
      opencode: cloud_minimax

  # ── DPMtF-WebUI shipped example flows (migration 091) ─────────────────
  # Role keys match bridge_roles.role_key EXACTLY (the allocator role-key
  # contract). All eight resolve cloud_minimax over OpenCode — the same
  # block ships in roles.example.yaml so a fresh cross-repo install works
  # with a single MINIMAX_API_KEY.
  ex-super-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  ex-imple-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  ex-review-cl:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-planning-supervisor:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-execution-decomposer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-implementer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-reviewer:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  example-escalation-supervisor:
    default_alias: cloud_minimax
    client_aliases:
      opencode: cloud_minimax

  # ── DPMtF 9010 flows (migration 093) — PLOOP planning supervisor ─────
  # DeepSeek V4 Pro DIRECT at DeepSeek over claude-code. The 9010 ELOOP
  # roles run codex as a native harness (harness_provider) and therefore
  # need no entry here.
  9010-planning-supervisor:
    default_alias: cloud_deepseek
    client_aliases:
      claude-code: cloud_deepseek
