runtime_profiles:
  local_ollama_cuda0:
    backend: ollama
    api_base_env: OLLAMA_BASE_URL
    default_api_base: http://127.0.0.1:11434
    gpu: cuda0

  local_llamacpp_cuda0:
    backend: llama_cpp
    # Example paths are illustrative only; real values come from env vars.
    server_bin_env: LLAMA_SERVER_BIN
    model_root_env: MODEL_ROOT_GGUF
    default_port: 8080
    default_gpu_layers: 99
    default_ctx: 131072
    gpu: cuda0

  cloud_minimax:
    backend: openai_compatible
    api_base_env: MINIMAX_API_BASE
    api_key_env: MINIMAX_API_KEY
    # The adapters append /v1 themselves, so the base stops at the host.
    # MiniMax also exposes an Anthropic-shaped endpoint (/anthropic), but the
    # claude-code adapter rejects provider=minimax, so only the OpenAI-
    # compatible path is wired.
    default_api_base: https://api.minimax.io
    provider: minimax

  cloud_openrouter:
    backend: openai_compatible
    api_base_env: OPENROUTER_API_BASE
    api_key_env: OPENROUTER_API_KEY
    default_api_base: https://openrouter.ai/api
    provider: openrouter

  cloud_anthropic:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    provider: anthropic
    # "subscription" = use Claude Code's own login (Max/Pro plan).
    # "api_key"      = bill the API using $api_key_env (the previous behaviour).
    # Subscription blanks ANTHROPIC_API_KEY / BASE_URL / AUTH_TOKEN so neither an
    # inherited key nor an inherited base URL can redirect the session away from
    # the subscription login.
    credentials: subscription

  local_llamacpp_laguna:
    backend: llama_cpp
    server_bin_env: LLAMA_SERVER_BIN
    model_root_env: MODEL_ROOT_GGUF
    default_port: 8080
    default_host: 127.0.0.1
    gpu: cuda0

  local_sglang_cuda0:
    backend: sglang
    venv: ${SGLANG_VENV_PATH}
    default_port: 30000
    default_host: 127.0.0.1
    gpu: cuda0

  local_onyx:
    backend: onyx
    api_base_env: ONYX_API_BASE
    default_api_base: http://127.0.0.1:9162
    api_key_env: ONYX_API_KEY
    email_env: ONYX_EMAIL
    password_env: ONYX_ADMIN_PASSWORD
    provider: onyx
    capabilities: [invoke]

  # A client that manages its own model and runtime (freebuff). Nothing to
  # start, stop or resolve -- the profile exists because every alias must
  # name one, and lying about a backend would invite lifecycle calls.
  external_tool:
    backend: external
