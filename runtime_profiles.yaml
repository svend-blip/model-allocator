runtime_profiles:
  local_ollama_cuda0:
    backend: ollama
    api_base_env: OLLAMA_BASE_URL
    default_api_base: http://127.0.0.1:11434
    gpu: cuda0

  # Ollama's Anthropic-compatible endpoint used as a proxy for a ":cloud"
  # model. Ollama forwards to its own cloud, so there is no local GPU to
  # manage (pair with lifecycle_policy: cloud_noop on the model). The
  # claude-code adapter's ollama branch sets ANTHROPIC_BASE_URL=<endpoint>
  # and ANTHROPIC_AUTH_TOKEN=ollama, which is exactly the Human-provided
  # invocation for deepseek-v4-pro:cloud (2026-08-11).
  ollama_cloud:
    backend: ollama
    api_base_env: OLLAMA_BASE_URL
    default_api_base: http://127.0.0.1:11434

  local_llamacpp_cuda0:
    backend: llama_cpp
    # Example paths are illustrative only; real values come from env vars.
    server_bin_env: LLAMA_SERVER_BIN
    model_root_env: MODEL_ROOT_GGUF
    default_port: 8080
    default_gpu_layers: 99
    default_ctx: 131072
    gpu: cuda0

  cloud_minimax:
    backend: openai_compatible
    api_base_env: MINIMAX_API_BASE
    api_key_env: MINIMAX_API_KEY
    # The adapters append /v1 themselves, so the base stops at the host.
    # MiniMax also exposes an Anthropic-shaped endpoint (/anthropic), but the
    # claude-code adapter rejects provider=minimax, so only the OpenAI-
    # compatible path is wired.
    default_api_base: https://api.minimax.io
    provider: minimax

  cloud_openrouter:
    backend: openai_compatible
    api_base_env: OPENROUTER_API_BASE
    api_key_env: OPENROUTER_API_KEY
    default_api_base: https://openrouter.ai/api
    provider: openrouter

  # DIRECT at DeepSeek — no OpenRouter, no local relay (Human decision
  # 2026-09-01, the 9010 flows). The base is DeepSeek's own
  # Anthropic-compatible surface, which is the documented way to drive
  # Claude Code against DeepSeek; the claude-code adapter's
  # openai_compatible branch turns it into ANTHROPIC_BASE_URL +
  # ANTHROPIC_AUTH_TOKEN=$DEEPSEEK_API_KEY. Live-verified 2026-09-01.
  cloud_deepseek_direct:
    backend: openai_compatible
    api_base_env: DEEPSEEK_API_BASE
    api_key_env: DEEPSEEK_API_KEY
    default_api_base: https://api.deepseek.com/anthropic
    provider: deepseek

  cloud_anthropic:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    provider: anthropic
    # "subscription" = use Claude Code's own login (Max/Pro plan).
    # "api_key"      = bill the API using $api_key_env (the previous behaviour).
    # Subscription blanks ANTHROPIC_API_KEY / BASE_URL / AUTH_TOKEN so neither an
    # inherited key nor an inherited base URL can redirect the session away from
    # the subscription login.
    credentials: subscription

  local_llamacpp_laguna:
    backend: llama_cpp
    server_bin_env: LLAMA_SERVER_BIN
    model_root_env: MODEL_ROOT_GGUF
    default_port: 8080
    default_host: 127.0.0.1
    gpu: cuda0

  local_sglang_cuda0:
    backend: sglang
    venv: ${SGLANG_VENV_PATH}
    default_port: 30000
    default_host: 127.0.0.1
    gpu: cuda0

  local_onyx:
    backend: onyx
    api_base_env: ONYX_API_BASE
    default_api_base: http://127.0.0.1:9162
    api_key_env: ONYX_API_KEY
    email_env: ONYX_EMAIL
    password_env: ONYX_ADMIN_PASSWORD
    provider: onyx
    capabilities: [invoke]

  # A client that manages its own model and runtime (freebuff). Nothing to
  # start, stop or resolve -- the profile exists because every alias must
  # name one, and lying about a backend would invite lifecycle calls.
  external_tool:
    backend: external

  # FreeToken: GPU-resident inference runtime with an OpenAI-compatible API,
  # qualified on the RTX 5090 workstation against FreeToken 0.1.2 (source
  # 2757bb5). The install is deliberately external to this allocator and lives
  # in its own project-local venv, so `ft` is absent from the PATH of any
  # service environment -- hence an explicit executable rather than a name.
  #
  # FreeToken also ships `ft launch codex` / `ft launch claude`. Those are not
  # used and must not be: starting a coding interface is the harness
  # allocator's authority. This allocator only ever runs `ft serve`.
  freetoken_cuda0:
    backend: freetoken
    executable: ${FREETOKEN_BIN}
    default_port: 8088
    default_host: 127.0.0.1
    gpu: cuda0
    qualified_runtime_version: "0.1.2"
