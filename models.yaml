models:
  imple-fast:
    runtime_profile: local_ollama_cuda0
    # Same blob as qwen36-27b-q4km:latest (both ID a50eda8ed977); this is
    # the canonical tag.
    real_model: qwen3.6:27b-q4_K_M
    # 65536, not 131072. At 128k the KV cache for a 27B lands somewhere
    # around 8-15 GB on top of ~17 GB of weights — 25-32 GB against a 32.6 GB
    # card, so the load tips over the edge and Ollama silently puts the
    # remainder on the CPU. That failure reports success and costs a factor
    # of ten in speed: observed 2026-08-05 with qwen3-coder:30b-256k at 94%
    # CPU. An implementer works on one file from one handoff; 64k is ample.
    context: 65536
    lifecycle_policy: persistent
    # Set explicitly rather than inheriting Claude Code's 32000 default. That
    # default is what killed a supervisor turn on 2026-08-05 — 21 minutes of
    # generation lost to a ceiling nobody had chosen. A limit should be a
    # decision, not something the harness picks for you.
    max_output_tokens: 32768
    claude_extra_args:
      - "--autocompact"
      - "auto"
      - "--dangerously-skip-permissions"
    clients:
      opencode: true
      claude-code: true
  imple01-local:
    runtime_profile: local_ollama_cuda0
    # The 256k variant loads with its full baked context (262144) and
    # inflates to 33 GB — spilling 6% to CPU even as the only resident
    # model. The 96k-baked variant fits entirely on GPU; compiled handoffs
    # are far below 96k tokens.
    real_model: qwen3-coder-30b-96k
    context: 96256
    lifecycle_policy: stop_after_step
    # OpenCode's built-in ollama provider drops qwen3-coder's tool calls
    # (native XML emitted as plain text, nothing executes — 2026-07-27).
    # Route via @ai-sdk/openai-compatible against Ollama's /v1 endpoint,
    # which returns structured tool_calls for the same model.
    opencode_ollama_mode: openai_compatible
    clients:
      opencode: true
      claude-code: false
  imple01-claude:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder:30b-256k
    context: 131072
    lifecycle_policy: stop_after_step
    clients:
      opencode: false
      claude-code: true
  review-cloud:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b
    context: 65536
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
  openrouter-test:
    runtime_profile: cloud_openrouter
    real_model: qwen3-30b-a3b
    context: 131072
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
      claude-code: true
  company-knowledge:
    runtime_profile: local_onyx
    real_model: allocator-plain
    context: 32768
    persona_id: 1
    invoke_timeout: 120
    lifecycle_policy: cloud_noop
    clients:
      headless: true
  archi-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
      opencode: true
  trend-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6-35b-48k
    context: 48384
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  coder-96k-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder-30b-96k
    context: 96256
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  coder-48k-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder-30b-48k
    context: 48384
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  learn-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6-27b-32k
    context: 32768
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  review01-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
  review02-local:
    runtime_profile: local_ollama_cuda0
    # Same model as review01-local: the 35b-a3b MoE follows dispatch
    # instructions more reliably than the 27b dense q4 (which looped on
    # embedded signal commands), and the review01->review02 transition
    # avoids a full model swap since the weights are already loaded.
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    claude_extra_args:
      - "--autocompact"
      - "auto"
      - "--dangerously-skip-permissions"
    clients:
      opencode: true
      # Added 2026-08-05 for review01SG in llama_SG, which runs Claude Code.
      # The five roles already on this alias are unaffected — they use
      # opencode, and claude_extra_args only applies to the claude-code client.
      claude-code: true
  archi-pay:
    runtime_profile: cloud_openrouter
    real_model: z-ai/glm-5.2
    context: 131072
    lifecycle_policy: cloud_noop
    max_output_tokens: 32768
    clients:
      claude-code: true
  imple-pay:
    runtime_profile: cloud_openrouter
    real_model: moonshotai/kimi-k2.7-code
    context: 131072
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
  cloud_deepseek:
    runtime_profile: ollama_cloud
    # DeepSeek V4 Pro served via Ollama's Anthropic-compatible endpoint through
    # the claude-code client. Human-provided 2026-08-11:
    #   ANTHROPIC_BASE_URL=http://127.0.0.1:11434 ANTHROPIC_AUTH_TOKEN=ollama \
    #     claude --model deepseek-v4-pro:cloud
    real_model: deepseek-v4-pro:cloud
    # PROVISIONAL context — verify against the served model; 128k is a safe floor.
    context: 131072
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true
  cloud_minimax:
    runtime_profile: cloud_minimax
    # MiniMax's newest coding model; limits mirror models.dev metadata
    # (context 1,000,000 / output 128,000). Output is capped at 64k here
    # because OpenCode never needs more in a single reply and the cap keeps
    # a runaway turn from billing a full 128k completion.
    real_model: MiniMax-M3
    context: 1000000
    max_output_tokens: 65536
    lifecycle_policy: cloud_noop
    # claude-code is deliberately absent: the claude_code adapter rejects
    # provider=minimax (no Anthropic-shaped support at the time of writing).
    #
    # pi reaches MiniMax through Pi's own first-party provider — the one in
    # its providers.md auth table, keyed `minimax` — rather than a generic
    # openai-compatible block. Not the same thing as a third-party MiniMax
    # provider extension from Pi's package system, which would be a
    # different implementation under the same provider name; `pi list`
    # reported none installed when this was measured. The distinction is the
    # point of declaring both clients:
    # OpenCode/MiniMax produced a textual imitation of a tool call instead of
    # a structured one in five of seven completed turns on 2026-08-12, and
    # the same failure is documented upstream for MiniMax-M2.7. Whether that
    # is the model or the harness is what a same-model, same-task comparison
    # between these two clients settles.
    clients:
      opencode: true
      pi: true
  fable5:
    runtime_profile: cloud_anthropic
    real_model: claude-fable-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true
  opus5:
    runtime_profile: cloud_anthropic
    # Half of Fable 5's price ($5/$25 vs $10/$50 per MTok) and sufficient for
    # supervisor runs, which rebuild state from durable files on every wake-up
    # instead of holding a multi-day context.
    real_model: claude-opus-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true
  sonnet5:
    runtime_profile: cloud_anthropic
    # The supervisor roles' model as of 2026-07-29. The stateless-per-wake-up
    # design of 501_SUPERVISOR_AUTONOMOUS.md is what makes this viable: each
    # wake-up rebuilds state from GOAL.md, RUN-LEDGER.md and BACKLOG.md and
    # then acts once, so no wake-up needs to hold a long-running context.
    real_model: claude-sonnet-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true

  laguna-local:
    runtime_profile: local_llamacpp_laguna
    real_model: Laguna-S-2.1-IQ4_XS
    server_bin_path: ${LLAMA_SERVER_BIN}
    model_path: ${MODEL_ROOT_GGUF}/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS-00001-of-00002.gguf
    context: 262144
    lifecycle_policy: stop_after_step
    n_cpu_moe: 31
    cache_type_k: q4_0
    cache_type_v: q4_0
    gpu_layers: 99
    reasoning: "on"
    reasoning_budget: 2048
    jinja: true
    load_mode: none
    # One slot, full context. Three slots looked like the obvious choice for
    # three roles, but llama.cpp splits --ctx-size across them: each role got
    # 87k instead of 262144, and the supervisor's cold-start procedure — which
    # reads GOAL, ledger, backlog and two governance files before acting —
    # started losing the thread and ran a single response past Claude Code's
    # 32000 output-token ceiling. The roles never run concurrently, so the
    # only cost of one slot is re-processing the prompt when the active role
    # changes, a few times per handoff cycle. Context is worth more here.
    parallel: 1
    claude_extra_args:
      - "--autocompact"
      - "auto"
      - "--dangerously-skip-permissions"
    clients:
      claude-code: true

  # GLM-4.5-Air-Derestricted for reveng's Rev_Supervisor, through OpenCode.
  # Since 2026-08-14 Rev_Imple runs locally too (qwen35-uncensored-local), so
  # dispatch swaps between the two at every supervisor<->imple handoff.
  #
  # The GGUF is mradermacher's byte-split (`.gguf.part1of2` / `part2of2`), NOT
  # llama.cpp's split-GGUF format -- part2 carries no GGUF header, so the
  # server cannot open the parts and `--model .part1of2` fails on a file that
  # looks superficially right. The parts are concatenated once into the path
  # below; if that file goes missing, `cat part1of2 part2of2 > *.gguf` remakes
  # it. Naming it `-00001-of-00002.gguf` would NOT work: that would make
  # llama.cpp look for shards that were never produced.
  #
  # Port 8080 is shared with laguna-local AND qwen35-uncensored-local on
  # purpose. All are stop_after_step and never wanted at once, and a shared
  # port fails loudly on bind if one is still resident. Distinct ports would
  # let two load and quietly starve the card instead — proven live on
  # 2026-08-14, when qwen35 (then on 8081) held the card while GLM's warm
  # OOM'ed silently at two reveng verdict deliveries.
  glm-air-derestricted-local:
    runtime_profile: local_llamacpp_cuda0
    real_model: glm-4.5-air-derestricted
    display_name: GLM-4.5-Air-Derestricted (IQ4_XS)
    server_bin_path: ${LLAMA_SERVER_BIN}
    model_path: ${MODEL_ROOT_GGUF}/GLM-4.5-Air-Derestricted-IQ4_XS/GLM-4.5-Air-Derestricted.IQ4_XS.gguf
    opencode_provider_name: glm-local
    # Measured from the GGUF metadata: glm4moe, 47 blocks, 128 experts,
    # head_count_kv 8, key/value length 128. Expert weights are ~1.17 GB per
    # layer, so n_cpu_moe 32 keeps ~21 GB of weights on the 5090 and ~37 GB in
    # host RAM; q8_0 KV at 65536 costs ~6.5 GB of the remainder. The model's
    # native window is 131072 -- raising `context` means lowering the GPU's
    # share of the experts, not just spending spare VRAM.
    context: 65536
    max_output_tokens: 16384
    lifecycle_policy: stop_after_step
    n_cpu_moe: 32
    cache_type_k: q8_0
    cache_type_v: q8_0
    flash_attn: "on"
    gpu_layers: 99
    jinja: true
    # Not mmap: 37 GB of experts mapped against a machine that also runs a
    # browser and ComfyUI invites page-in stalls mid-generation. `none` makes
    # the memory a startup cost, and a shortage an immediate failure rather
    # than a slow one.
    load_mode: none
    parallel: 1
    clients:
      opencode: true
      pi: true

  qwen-shared-sglang:
    runtime_profile: local_sglang_cuda0
    real_model: Qwen3-Coder-30B-A3B-Instruct
    served_model_name: qwen-shared
    model_path: ${MODEL_ROOT_SGLANG}/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
    context: 32768
    lifecycle_policy: persistent
    max_output_tokens: 8192
    mem_fraction_static: 0.82
    max_running_requests: 2
    tool_call_parser: qwen3_coder
    clients:
      opencode: true

  # freebuff carries its own model config; the alias exists so the role can
  # take the standard allocator start path (roles.yaml -> alias -> client).
  freebuff-cli:
    runtime_profile: external_tool
    real_model: freebuff-managed
    lifecycle_policy: cloud_noop
    clients:
      freebuff: true

  qwen35-uncensored-local:
    runtime_profile: local_llamacpp_cuda0
    real_model: qwen35-a3b-uncensored
    display_name: Qwen3.5-35B-A3B-Uncensored (Q6_K)
    server_bin_path: ${LLAMA_SERVER_BIN}
    model_path: ${MODEL_ROOT_GGUF}/Qwen3.5-35B-A3B-Uncensored-Q6_K/Qwen3.5-35B-A3B-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
    opencode_provider_name: qwen35-local
    # 8080 on purpose — the shared one-at-a-time port (see the glm-air block
    # above). On its own 8081 this model could sit resident while GLM's warm
    # OOM'ed silently into the remaining VRAM (2026-08-14); on 8080 the
    # second server fails loudly on bind instead.
    port: 8080
    # 131072 OOM'ed on the 32 GB card (weights 28.5 GB + q8_0 KV cache +
    # ComfyUI's resident ~3.8 GB), and 65536 with full offload was 244 MiB
    # short. Two expert layers on CPU keep the Human's 65536 context with
    # ~1.6 GB headroom at 201 tok/s (measured 2026-08-14; full offload at
    # 49152 gave 256 tok/s but only ~0.6 GB headroom — Human chose this).
    context: 65536
    n_cpu_moe: 2
    max_output_tokens: 16384
    lifecycle_policy: stop_after_step
    temp: 0.6
    cache_type_k: q8_0
    cache_type_v: q8_0
    flash_attn: 'on'
    gpu_layers: 99
    jinja: true
    parallel: 1
    clients:
      opencode: true
      pi: true

  # Qwen3.8-27B (UD-Q5_K_XL) on the dedicated qwen38 llama.cpp build.
  # server_bin_path is deliberately a literal path, NOT ${LLAMA_SERVER_BIN}:
  # that env var points at the laguna build, and an unset override variable
  # would resolve to "" and fall back to the wrong binary silently —
  # a literal path fails loudly in server_bin() if the build moves.
  # draft-mtp uses the model's baked-in MTP head for speculative decoding,
  # which is why the qwen38 build is required. Port 8080 is the shared
  # one-at-a-time port (see the glm-air block above): both aliases are
  # stop_after_step, and a second server fails loudly on bind.
  Qwen38-Standard:
    runtime_profile: local_llamacpp_cuda0
    real_model: qwen3.8-27b
    display_name: Qwen3.8-27B UD-Q5_K_XL (128k)
    server_bin_path: /home/svend/llama.cpp-qwen38/build/bin/llama-server
    model_path: ${MODEL_ROOT_GGUF}/Qwen3.8-27B/UD-Q5_K_XL/Qwen3.8-27B-UD-Q5_K_XL.gguf
    port: 8080
    context: 131072
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    cache_type_k: q8_0
    cache_type_v: q8_0
    flash_attn: "on"
    gpu_layers: 99
    jinja: true
    parallel: 1
    spec_type: draft-mtp
    spec_draft_n_max: 2
    clients:
      opencode: true
      claude-code: true

  # Same runtime as Qwen38-Standard but with the full 256k window.
  Qwen38-LongContext:
    runtime_profile: local_llamacpp_cuda0
    real_model: qwen3.8-27b
    display_name: Qwen3.8-27B UD-Q5_K_XL (256k)
    server_bin_path: /home/svend/llama.cpp-qwen38/build/bin/llama-server
    model_path: ${MODEL_ROOT_GGUF}/Qwen3.8-27B/UD-Q5_K_XL/Qwen3.8-27B-UD-Q5_K_XL.gguf
    port: 8080
    context: 262144
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    cache_type_k: q8_0
    cache_type_v: q8_0
    flash_attn: "on"
    gpu_layers: 99
    jinja: true
    parallel: 1
    spec_type: draft-mtp
    spec_draft_n_max: 2
    clients:
      opencode: true
      claude-code: true

  # ───────────────────────────────────────────────────────────────
  # V6 live acceptance (Gates 2-4, 2026-08-15) — two DPMtF-facing
  # aliases sharing the Laguna foundation runtime declared below.
  # ───────────────────────────────────────────────────────────────
  laguna-archi-shared:
    runtime_instance: laguna-shared-118b
    inference_profile: laguna-careful
    real_model: Laguna-S-2.1-IQ4_XS
    reasoning: "on"
    load_mode: none
    claude_extra_args:
      - "--autocompact"
      - "auto"
      - "--dangerously-skip-permissions"
    clients:
      opencode: true
      claude-code: true

  laguna-review-shared:
    runtime_instance: laguna-shared-118b
    inference_profile: laguna-fast
    real_model: Laguna-S-2.1-IQ4_XS
    reasoning: "on"
    load_mode: none
    claude_extra_args:
      - "--autocompact"
      - "auto"
      - "--dangerously-skip-permissions"
    clients:
      opencode: true
      claude-code: true

  # ── FreeToken (qualified on the RTX 5090 workstation, ft 0.1.2) ─────────
  # Port 8088, deliberately NOT 8080: that port is the one-at-a-time llama.cpp
  # port and is reclaim-swept weekdays 14:00Z by the trade engine.
  #
  # Both profiles reproduce a command that was measured working. The options
  # here are not tuning knobs to be tidied away -- see nvfp4_backend below.
  #
  # Neither alias declares claude-code. FreeToken does expose an
  # Anthropic-shaped /v1/messages, and the adapter reports it when the runtime
  # confirms it, but routing a client at it is a separate qualification: the
  # first harness integration goes over the OpenAI-compatible endpoint.

  # Dense NVFP4. No MoE options: this checkpoint reports moe=false, and MoE
  # flags on a dense model configure something that is not there.
  freetoken-qwen38-27b:
    runtime_profile: freetoken_cuda0
    real_model: Qwen3.8-27B-NVFP4
    display_name: Qwen3.8-27B NVFP4 (FreeToken, 256k)
    model_path: vrfai/Qwen3.8-27B-NVFP4
    port: 8088
    context: 262144
    lifecycle_policy: stop_after_step
    memory_ratio: 0.90
    # Load-bearing. On this card the qualification measured ~4.3 tok/s on the
    # default Triton NVFP4 path against ~63 tok/s with the backend chosen
    # automatically -- the same 219-token workload went from 51s to 3.5s.
    # A configuration cleanup that drops this line costs a factor of fifteen.
    nvfp4_backend: auto
    # Measured at ready in FT-5: 29273 MiB in use. A start that finds
    # less free than this would load weights for minutes and then die
    # on CUDA OOM — refusing up front costs seconds instead.
    min_free_vram_mib: 30000
    sampling_defaults: model
    reasoning_parser: auto
    tool_call_parser: auto
    qualification:
      status: validated
      runtime_version: "0.1.2"
      gpu_class: RTX_5090
      cuda_major: 13
    clients:
      opencode: true

  # MoE control profile. Kept as the second qualified configuration because
  # Qwen3.6 and Qwen3.8 exercise materially different FreeToken paths, and a
  # single profile would let one of them rot unnoticed.
  freetoken-qwen36-35b-a3b:
    runtime_profile: freetoken_cuda0
    real_model: Qwen3.6-35B-A3B
    display_name: Qwen3.6-35B-A3B (FreeToken MoE, 256k)
    model_path: Qwen/Qwen3.6-35B-A3B
    port: 8088
    context: 262144
    lifecycle_policy: stop_after_step
    memory_ratio: 0.90
    moe_backend: auto
    moe_cache_auto: true
    kv_reserve_tokens: 16384
    # Measured, not guessed (FT-6). Left unset, FreeToken sizes the KV budget
    # from whatever VRAM the MoE cache leaves and lands on 16542 tokens, which
    # a coding harness exceeds before it has read a single file. 49152 tokens
    # costs 0.94 GiB here — a third of what the dense profile pays for the
    # same count, because far fewer parameters are active — and leaves ~2.6 GB
    # headroom. This is the difference between a model that answers questions
    # and one that can host an agent.
    num_tokens: 49152
    # Measured at ready with that KV budget: 30011 MiB in use.
    min_free_vram_mib: 30500
    sampling_defaults: model
    reasoning_parser: auto
    tool_call_parser: auto
    qualification:
      status: validated
      runtime_version: "0.1.2"
      gpu_class: RTX_5090
      cuda_major: 13
    clients:
      opencode: true
      # qwen stays declared: the client CAN reach this alias, and the launch
      # path built for it works. What does not work is the pairing — Qwen
      # Code cannot be told this alias holds 49152 rather than the 262144 it
      # advertises, so it fills the real budget believing it is at 5%. The
      # 1000 ELOOP roles moved to OpenCode on 2026-08-27 for that reason.
      # Declaring the client is not a recommendation to use it here.
      qwen: true

# V6 — one physical llama-server shared by the two aliases above.
# Port 8090, NOT 8080: 8080 is the deliberate one-at-a-time port and is
# reclaim-swept weekdays 14:00Z by the trade engine. Parameters are the
# committed laguna-local baseline (GOAL 016: no performance tuning).
runtime_instances:
  laguna-shared-118b:
    runtime_profile: local_llamacpp_laguna
    model_path: ${MODEL_ROOT_GGUF}/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS-00001-of-00002.gguf
    server_bin_path: ${LLAMA_SERVER_BIN}
    port: 8090
    context: 262144
    n_cpu_moe: 31
    gpu_layers: 99
    cache_type_k: q4_0
    cache_type_v: q4_0
    lifecycle_policy: shared_runtime
    # Server-behaviour flags carried over from the proven laguna-local
    # alias; unknown-instance-field warnings from the doctor are expected
    # (forward-compat allow-list) and harmless.
    jinja: true
    parallel: 1

# V6 — per-alias inference tuning for the shared aliases.
inference_profiles:
  laguna-careful:
    reasoning_budget: 2048
    max_output_tokens: 16384

  laguna-fast:
    reasoning_budget: 1024
    max_output_tokens: 8192
