models:
  imple-fast:
    runtime_profile: local_ollama_cuda0
    real_model: qwen36-27b-q4km:latest
    context: 131072
    lifecycle_policy: persistent
    clients:
      opencode: true
      claude-code: true
  imple01-local:
    runtime_profile: local_ollama_cuda0
    # The 256k variant loads with its full baked context (262144) and
    # inflates to 33 GB — spilling 6% to CPU even as the only resident
    # model. The 96k-baked variant fits entirely on GPU; compiled handoffs
    # are far below 96k tokens.
    real_model: qwen3-coder-30b-96k
    context: 96256
    lifecycle_policy: stop_after_step
    # OpenCode's built-in ollama provider drops qwen3-coder's tool calls
    # (native XML emitted as plain text, nothing executes — 2026-07-27).
    # Route via @ai-sdk/openai-compatible against Ollama's /v1 endpoint,
    # which returns structured tool_calls for the same model.
    opencode_ollama_mode: openai_compatible
    clients:
      opencode: true
      claude-code: false
  imple01-claude:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder:30b-256k
    context: 131072
    lifecycle_policy: stop_after_step
    clients:
      opencode: false
      claude-code: true
  review-cloud:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b
    context: 65536
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
  openrouter-test:
    runtime_profile: cloud_openrouter
    real_model: qwen3-30b-a3b
    context: 131072
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
      claude-code: true
  company-knowledge:
    runtime_profile: local_onyx
    real_model: allocator-plain
    context: 32768
    persona_id: 1
    invoke_timeout: 120
    lifecycle_policy: cloud_noop
    clients:
      headless: true
  archi-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
      opencode: true
  trend-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6-35b-48k
    context: 48384
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  coder-96k-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder-30b-96k
    context: 96256
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  coder-48k-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3-coder-30b-48k
    context: 48384
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  learn-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6-27b-32k
    context: 32768
    lifecycle_policy: stop_after_step
    max_output_tokens: 32768
    clients:
      claude-code: true
  review01-local:
    runtime_profile: local_ollama_cuda0
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
  review02-local:
    runtime_profile: local_ollama_cuda0
    # Same model as review01-local: the 35b-a3b MoE follows dispatch
    # instructions more reliably than the 27b dense q4 (which looped on
    # embedded signal commands), and the review01->review02 transition
    # avoids a full model swap since the weights are already loaded.
    real_model: qwen3.6:35b-a3b-64k
    context: 65536
    lifecycle_policy: stop_after_step
    clients:
      opencode: true
  archi-pay:
    runtime_profile: cloud_openrouter
    real_model: z-ai/glm-5.2
    context: 131072
    lifecycle_policy: cloud_noop
    max_output_tokens: 32768
    clients:
      claude-code: true
  imple-pay:
    runtime_profile: cloud_openrouter
    real_model: moonshotai/kimi-k2.7-code
    context: 131072
    lifecycle_policy: cloud_noop
    clients:
      opencode: true
  cloud_minimax:
    runtime_profile: cloud_minimax
    # MiniMax's newest coding model; limits mirror models.dev metadata
    # (context 1,000,000 / output 128,000). Output is capped at 64k here
    # because OpenCode never needs more in a single reply and the cap keeps
    # a runaway turn from billing a full 128k completion.
    real_model: MiniMax-M3
    context: 1000000
    max_output_tokens: 65536
    lifecycle_policy: cloud_noop
    # claude-code is deliberately absent: the claude_code adapter rejects
    # provider=minimax (no Anthropic-shaped support at the time of writing).
    clients:
      opencode: true
  fable5:
    runtime_profile: cloud_anthropic
    real_model: claude-fable-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true
  opus5:
    runtime_profile: cloud_anthropic
    # Half of Fable 5's price ($5/$25 vs $10/$50 per MTok) and sufficient for
    # supervisor runs, which rebuild state from durable files on every wake-up
    # instead of holding a multi-day context.
    real_model: claude-opus-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true
  sonnet5:
    runtime_profile: cloud_anthropic
    # The supervisor roles' model as of 2026-07-29. The stateless-per-wake-up
    # design of 501_SUPERVISOR_AUTONOMOUS.md is what makes this viable: each
    # wake-up rebuilds state from GOAL.md, RUN-LEDGER.md and BACKLOG.md and
    # then acts once, so no wake-up needs to hold a long-running context.
    real_model: claude-sonnet-5
    context: 200000
    lifecycle_policy: cloud_noop
    clients:
      claude-code: true

  laguna-local:
    runtime_profile: local_llamacpp_laguna
    real_model: Laguna-S-2.1-IQ4_XS
    server_bin_path: /home/svend/llama.cpp-laguna/build/bin/llama-server
    model_path: /home/svend/models/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS/Laguna-S-2.1-IQ4_XS-00001-of-00002.gguf
    context: 262144
    lifecycle_policy: stop_after_step
    n_cpu_moe: 31
    cache_type_k: q4_0
    cache_type_v: q4_0
    gpu_layers: 99
    reasoning: "on"
    reasoning_budget: 2048
    jinja: true
    load_mode: none
    parallel: 1
    claude_extra_args:
      - "--autocompact"
      - "auto"
    clients:
      claude-code: true

  qwen-shared-sglang:
    runtime_profile: local_sglang_cuda0
    real_model: Qwen3-Coder-30B-A3B-Instruct
    served_model_name: qwen-shared
    model_path: /home/svend/models/sglang/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
    context: 32768
    lifecycle_policy: persistent
    max_output_tokens: 8192
    mem_fraction_static: 0.82
    max_running_requests: 2
    tool_call_parser: qwen3_coder
    clients:
      opencode: true
