[project]
name = "model-allocator"
version = "0.1.0"
description = "DPMtF Model Allocator — runtime/model alias layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.28.1"]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
model-allocator = "model_allocator.cli:main"
model-allocator-web = "model_allocator.web.app:run"
